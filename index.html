<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recettes du Monde</title>
  <link rel="stylesheet" href="/assets/style/styles.css" />
  <script type="module" src="assets/script/script.js" defer ></script>
</head>
<body>
  <header>
    <h1>🍲 Recettes du Monde</h1>
  </header>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="🔍 Rechercher une recette..." />
  </div>

  <section class="recipes-grid" id="recipesContainer">
  </section>
  
  <dialog id="recipeModal">
  <button id="closeModal" type="button">Fermer</button>

  <h2 id="modalName"></h2>
  <p id="modalTime"></p>
  <p id="modalDescription"></p>
  <p id="modalAppliance"></p>

  <h3>Ustensiles</h3>
  <ul id="modalUstensils"></ul>

  <h3>Ingrédients</h3>
  <ul id="modalIngredients"></ul>
</dialog>
</body>
</html>
